name: Increment run counter

on:
  push:
    branches: [main]

# The bot's own commit carries [skip ci], which GitHub uses to suppress this
# workflow, so pushing back to main does not cause an infinite loop.

permissions:
  contents: write

concurrency:
  group: increment-counter
  cancel-in-progress: false

jobs:
  bump:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Bump counter in README
        run: ./scripts/increment.sh README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update runner stats [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
